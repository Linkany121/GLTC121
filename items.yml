    glow: true
    lore:
    - '&#fff5b3附属的不同功能的机器与物品间的分类以势力分类，'
    - '&#fff5b3主要使用方法为：'
    - '&#fff5b3使用&#ff00df星&#c600ea渊&#8c00f4造&#5300ff物&#ac00ff™&#ffebb3势力所提供的机器，'
    - '&#fff5b3获取不同星座的星图，然后通过编织星图中的记忆纤维；'
    - '&#fff5b3以获取不同势力机器的蓝图，并通过蓝图制造机器。'
    - '&c提示：&#ffebb3本附属非轮椅向，并且与粘液的科技线分离。'
    - '&c提示：&#ffebb3特别提示：假如机器显示50j/秒，实际是25j/粘液刻；'
    - '&c提示：&#ffebb3因为每个服务器每秒粘液刻不同，实际消耗会随着服务器的数值而变化。'
