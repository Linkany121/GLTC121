OST介绍:
  lateInit: false
  item_group: DLC_B1
  item:
    name: "&#e0e5ff存&#cbd8f4档&#b6cbe8信&#a1bedd息 &#22a719奥&#1fb218史&#1cbe18莱&#19c917特&#16d416中&#13e016古&#10eb15科&#1ce616技&#27e117爱&#33dc18好&#3fd61a者&#4ad11b协&#56cc1c会"
    material: BOOK
    modelId: 1210342
    glow: true
    lore:
    - '&b星座&9：&2由蕨座'
    - '&#fff5b3奥史莱特中古科技爱好者协会，是由一些古代机械爱好者组成的团体，'
    - '&#fff5b3这些富有又无聊、却又有一些科研头脑的有钱人们在一个尚未开荒的宜居星座建立了工业区，'
    - '&#fff5b3这些工业区专门用于生产、制造、续写一些古代的科技与奥术材料。'
    - '&#fff5b3当然，更为有趣的是他们用这座工业区的收益投资，将收益用于发掘与维护古代科技。'
    - '&#fff5b3在大崩溃来临后，这些有钱的科研天才（其实没多天才）把蓝图记录并向星空发射，然后就去重型堡垒舰避难了。'
    - '&#fff5b3但有一人，却坚守着工业区一同沉寂、崩塌，在死前，他朝星空轻声说道：“接好了，这是，最后的轮椅了。”，后来的学者至今不知道何意。'
    - '&7由于该附属是为了优化原版粘液科技流程而作，为了消解歧义，后文统一将“原版粘液科技”成为SF。'
  recipe_type: NULL
  amount: 1

