    name: "&#e0e5ff存&#cbd8f4档&#b6cbe8信&#a1bedd息 &#7ad3edG&#78c6edL&#75b9ecT&#73acecC&#70a0ec更&#6e93ec新&#6b86eb日&#6979eb志 &#f9ff984.0.0"
    material: glow_item_frame
    modelId: 1210015
    glow: true
    lore:
    - '&b时间：&f2026年8月17日'
    - '&#fff5b3第二阶段崭新出厂！紧赶慢赶还是赶在一个月内更新了哈哈，这次就不按照格式了。'
    - '&#fff5b3第一到第二阶段的承上启下势力正式完工初版了，虽然后续还是会有调整。'
    - '&#fff5b3花了这么多时间主要还是花时间去想流程，顺便做了例如订单这样的新机制，当然订单可能挺坐牢的。'
    - '&#fff5b3其次，已有的势力也进行了中幅度的修改，能源流系统和DLC的两个势力也在数值上进行了大削。'
    - '&#fff5b3顺便给FKRT增加了一些新东西：'
    - '&#fff5b3ASPL补完，新的伏地和风墟龙冕，增加了两把新的枪械（有滋崩）。'
    - '&#fff5b3得益于香蕉神的帮助以及一些优化，现在所有脚本性能上都有显著提升。'
    - '&#fff5b3制作材质包的计划也在路上了，稍微等待吧。'
