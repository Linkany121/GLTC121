    lore:
    - '&b时间：&f2026 5 20'
    - '&#fff5b3第一个正式版本，进行了最初的构建；'
    - '&a+ &#fff5b3ATO与星渊造物势力，是附属中提供最基础机器与物品与生产其他势力蓝图的势力。'
    - '&a+ &#fff5b3CTS白铃山矿业/霆石重工，两个一体的势力，提供了开采与利用特殊矿物的机器，同时也是其他势力机器原材料的提供势力。'
    - '&a+ &#fff5b3LIS莉尔幸丝有机声学工业，提供了利用与生产动植物原料的机器与特殊的生产方式。'
    - '&e? &#fff5b3计划增加(优先级高)：伊赭璃离岸专利管控协会，将提供一些关联性不高的各式各样便利性机器。'
    - '&e? &#fff5b3计划增加(优先级中)：烘炉光阀电力，将提供各式发电设施与电容。'
    - '&e? &#fff5b3计划增加(优先级中)：艾斯凯安精工、加德纳底安保、灰桓物流...：将提供武器、装备、工具与一些小道具。'
    - '&e? &#fff5b3计划增加(优先级中)：魔药联合、烹茄皇室、佳酿恒星...：将提供各式奇特的食物、饮品与神秘小玩意。'
    - '&e? &#fff5b3移除了him'
    - '&#fff5b3特别鸣谢冷殇、海曼与一众群里随机出没的大佬，在我附属制作的过程中提供了很多堪称一语惊醒梦中人的提示。'
    - '&#fff5b3特别鸣谢冷殇科技、海曼研究院、魔法1.0与云铭科技与rsc维基及其作者，我在遇到困难时参考了以上附属中的一些方法与技巧。'
  recipe_type: NULL
  amount: 1
  glow: true
  tier: -20

