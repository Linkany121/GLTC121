##介绍1
ls_LCA:
  lateInit: false
  item_group: A_E1
  item:
    name: "&#e0e5ff存&#cbd8f4档&#b6cbe8信&#a1bedd息 &#ffffff莉&#e7fff0尔&#cfffe2幸&#b8ffd3丝&#a0ffc4有&#88ffb6机&#70ffa7声&#59ff98学&#41ff8a工&#29ff7b业"
    material: BOOK
    modelId: 1210133
    glow: true
    lore:
    - '&b星座&9：&a四想座'
    - '&#fff5b3莉尔幸丝有机声学工业，是一座位于四想座第三行星的超巨型城市，'
    - '&#fff5b3整座城市都被冠以该工业科技公司的名号，城内居民也完全由公司员工构成。'
    - '&#fff5b3该城是他们所在国家的首都之一，也是整个四想座的经济与政治核心。'
    - '&#fff5b3莉尔幸丝通过“&#00ffb3创&#1dff9e世&#3aff88之&#57ff73歌&#fff5b3”工程，实现对内完全自洽且对外供应全四想座90%动植物原料。'
    - '&#fff5b3创世之歌，是莉尔幸丝工业对生命起源所作出的假说，认为一切生命都被一种独特“频段”在原始物质汤中催生。'
    - '&#fff5b3而这独特的频段所呈现的声音，被称为“创世之歌”。'
    - '&c但是，出于一场意外，能被你所用的LIS技术，位格已经降低——'
    - '&c也就是说，LIS的物品与机器描述，是位格降低之前的，现在出现在你手中的LIS物品，只是一些空有其表的有机质材料罢了。'
    - '&c虽然此时的LIS对你依然可堪大用，但日后，你也要寻找真正奇异的有机质研究势力。'
  recipe_type: NULL
  amount: 1

