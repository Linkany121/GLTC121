    modelId: 1210002
    glow: true
    lore:
    - '&b星座&9：&b银河系全域'
    - '&#fff5b3GLTC联合协会，全程月砧-多系联合全银河技术管控协会；'
    - '&#fff5b3他们是非盈利的中立协会，不属于任何星系与势力。'
    - '&#fff5b3在大崩溃后，为了逃离即将陨落的各大幸存星座与发掘陨落星座中的遗迹；'
    - '&#fff5b3GLTC寻找，并在各个新生星系中为新生文明提供循序渐进的科学技术；'
    - '&#fff5b3目前，GLTC由&#ff5300A&#ff5b00T&#ff6300O&#ff6b00协&#ff7300会&#fff5b3和&#ec00ff星&#ac00ff渊&#6c00ff造&#8c00ff物&#ac00ff™&#fff5b3组成'
    - '&#fff5b3除了这几个主要势力，还有大量的位于已陨落的星座中的已毁灭的势力的技术等待你发掘；'
    - '&#fff5b3这些技术来源于各个陨落的星系与势力，他们虽已陨落，但文明不会止步于灭亡。'
  recipe_type: NULL
  amount: 1
  glow: true
  tier: -20

