    name: "&#e0e5ff存&#cbd8f4档&#b6cbe8信&#a1bedd息 &#ffffff莉&#e7fff0尔&#cfffe2幸&#b8ffd3丝&#a0ffc4有&#88ffb6机&#70ffa7声&#59ff98学&#41ff8a工&#29ff7b业"
    material: BOOK
    modelId: 1210134
    glow: true
    lore:
    - '&b星座&9：&a四想座'
    - '&#fff5b3想要使用莉尔幸丝的技术，也就是创世之歌，其分为三部分：'
    - '&#fbff24进化之歌&#fff5b3：'
    - '&#fff5b3使用原生世界中的动植物原料进行调频，生成不同的频率：鼓点、和弦与旋律，并通过组合不同的旋律生产不同的被称为“乐曲”的奇异植物。'
    - '&#33ffa0悠久之歌&#fff5b3：'
    - '&#fff5b3通过“乐曲”来生产动植物材料与独特组件，并从中寻找“创世之歌”的频率碎片。'
    - '&#ff2ef8伪·&#00ffb3创&#1dff9e世&#3aff88之&#57ff73歌&#fff5b3：'
    - '&#fff5b3通过组合找到的频率碎片，短暂的播放创世之歌片段，以创造出更为强大的“乐曲”。'
    - '&c出于一场意外，能被你所用的LIS技术，位格已经降低——'
    - '&c也就是说，LIS的物品与机器描述，是位格降低之前的，现在出现在你手中的LIS物品，只是一些空有其表的有机质材料罢了。'
    - '&c虽然此时的LIS对你依然可堪大用，但日后，你也要寻找真正奇异的有机质研究势力。'
  recipe_type: NULL
  amount: 1

