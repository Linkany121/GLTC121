VASA介绍0:
  lateInit: false
  item_group: B_C0
  item:
    name: "&#e0e5ff存&#cbd8f4档&#b6cbe8信&#a1bedd息 &#811eff环&#7450fd夜&#6782fa谷&#5ab4f8巅&#4de6f5峰&#41ecf5术&#36c7f8士&#2ba2fa学&#217dfd会"
    material: BOOK
    modelId: 1210393
    glow: true
    lore:
    - '&b星座&9：&#4a9dff噬&#4981ff空&#4865ff座'
    - '&#fff5b3环夜谷是已知的历史最为悠久、术士培养体系最优渥的民间学术团体，'
    - '&#fff5b3在数万年间，他们数次优化术式构成体系与涵粒子转化流程，并无偿公开。'
    - '&#fff5b3在大崩溃来临之际，几乎全部的环夜谷术士都在各处抢险救灾，为文明燃尽最后的余热。'
    - '&#fff5b3他们的技术以粒子操控为核心，并且大多数机械仍以辅助人的驭粒力锻炼与术式操控为核心，'
    - '&#fff5b3通过环夜谷的器械设施，你也能流畅而写意地操控粒子，成为术士。'
  recipe_type: NULL
  amount: 1

VASA介绍01:
  lateInit: false
  item_group: B_C0
  item:
    name: "&#e0e5ff存&#cbd8f4档&#b6cbe8信&#a1bedd息 &#811eff环&#7450fd夜&#6782fa谷&#5ab4f8巅&#4de6f5峰&#41ecf5术&#36c7f8士&#2ba2fa学&#217dfd会"
    material: BOOK
    modelId: 1210393
    glow: true
    lore:
    - '&b星座&9：&#4a9dff噬&#4981ff空&#4865ff座'
    - '&#fff5b3在本部作品中，术士的设定如同寻常一样：'
    - '&#fff5b3术士是一种职业或能施术的智慧生物的统称，通过类松果体与类松垂体结构来吸收、转化、存储粒子，'
    - '&#fff5b3并通过脑后部、小脑与脊椎进行引导与操控粒子的活动。'
    - '&#fff5b3粒子物理法则的星系中，一切物质都由粒子构成，而被智慧生物制造或影响的粒子统称为涵粒子。'
    - '&#fff5b3涵粒子能组成单式：最基础和简单的粒子操作流程，而数个单式能组成一个基本式（一环术式），2个一环术式构成二环术式，以此类推。'
    - '&#fff5b3例如，五环43目术式·牛逼直升机，是2个四环术式嵌套，共由43个单式组成的术式。'
    - '&#fff5b3而术式根据种类与用途，也有不同的类别，在此不过多赘述。'
    - '&#fff5b3（将术式想象成一个数学题，只要智力正常并且经过相关学习就能施展，无需太强的天赋，也并非有些作品中的特殊血统、超能力一般的先天能力。）'
  recipe_type: NULL
  amount: 1

VASA介绍02:
  lateInit: false
  item_group: B_C0
  item:
    name: "&#e0e5ff存&#cbd8f4档&#b6cbe8信&#a1bedd息 &#811eff环&#7450fd夜&#6782fa谷&#5ab4f8巅&#4de6f5峰&#41ecf5术&#36c7f8士&#2ba2fa学&#217dfd会"
    material: BOOK
    modelId: 1210393
    glow: true
    lore:
    - '&b星座&9：&#4a9dff噬&#4981ff空&#4865ff座'
    - '&#fff5b3在本部作品中，玩家可用的术式体系如下：'
    - '&#fff5b3术士等级：共8个等级，每个等级对应可释放的术式环数（八级术士可额外释放9级术式）。'
    - '&#fff5b3驭粒熟练：能通过制作相应的道具与设施，直接或间接提升，熟练度满后通过考核提升术士等级。'
    - '&#fff5b3——————————'
    - '&#fff5b3粒子强度：数值，提升术式的最终伤害修正。'
    - '&#fff5b3松垂体容量：数值，提升粒子的可存储上限，施术将消耗粒子。'
    - '&#fff5b3心血管系统强度：百分比，影响术式的冷却时间。'
    - '&#fff5b3粒子折射：百分比，减少自己受到的粒子伤害。'
    - '&#fff5b3——————————'
    - '&#fff5b3可提升的原版数值：近战伤害白值，血量白值，防御白值，韧性白值，速度白值，手长白值，最终减伤百分比。'
    - '&#fff5b3——————————'
    - '&#fff5b3所有术式能造成的伤害类型：'
    - '&#c58876物&#c3816c理&#c17962伤&#bf7158害&#fff5b3：火焰、雷电等术式造成，使用原版的[&c近战伤害&#fff5b3]模型，受到原版防御、韧性与保护等级修正。'
    - '&#ad7ace粒&#ab70cc子&#a866ca伤&#a55cc8害&#fff5b3：常规术式造成，使用原版的[&b坚守者尖啸&#fff5b3]模型，忽略护甲、韧性与保护，受到粒子折射百分比修正。'
    - '&#d06d8f脉&#d16586冲&#d15c7c伤&#d15472害&#fff5b3：特殊术式或高环术式反噬造成，将直接&4扣除血量&#fff5b3，忽略常规减伤。'
    - '&f术式伤害：  &b系数  &f*  &d粒子强度  &f*  &cGLI  &f/  &e受击者防御系数'
    - '&#fff5b3——————————'
    - '&#fff5b3注：粒子浓度（GLI）无法增加，默认为1，可由服主在配置文件中更改，影响术式的最终伤害修正（0.01~100）。'
    - '&#fff5b3注：异能强度（SIT）无法增加。'
  recipe_type: NULL
  amount: 1

VASA介绍03:
  lateInit: false
  item_group: B_C0
  item:
    name: "&#e0e5ff存&#cbd8f4档&#b6cbe8信&#a1bedd息 &#811eff环&#7450fd夜&#6782fa谷&#5ab4f8巅&#4de6f5峰&#41ecf5术&#36c7f8士&#2ba2fa学&#217dfd会"
    material: BOOK
    modelId: 1210393
    glow: true
    lore:
    - '&b星座&9：&#4a9dff噬&#4981ff空&#4865ff座'
    - '&#fff5b3施术流程：'
    - '&#fff5b3首先，你需要一个 施术道具 ，只有手持施术道具时，才能进行相关操作。'
    - '&#fff5b3当你手持施术道具时，蹲下右键/蹲下左键，能够打开施术 GUI。'
    - '&#fff5b3施术 GUI 中：'
    - '&#fff5b3点击已装填的术式槽 = 选中该术式并关闭 GUI。'
    - '&#fff5b3GUI 关闭后：'
    - '&#fff5b3蹲下左键/蹲下右键 = 再次打开施术 GUI。'
    - '&#fff5b3右键 = 常规术式的施展。'
    - '&#fff5b3左键 = 部分术式的额外效果。'
    - '&#fff5b3每个施术道具有不同的可刻录槽位，这决定了可刻录的术式的数量。'
    - '&#fff5b3你需要将 施术道具 放入 术式刻录仪 中，将 术式载体 刻录进入 施术道具 。'
  recipe_type: NULL
  amount: 1

