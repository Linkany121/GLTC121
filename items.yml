    modelId: 1210177
    glow: true
    lore:
    - '&b星座&9：&#ba0000炼&#d10000诏&#e80000拳&#ff0000座'
    - '&#fff5b3缪尔罗素烘炉精密工坊，是一个专精于人工（存疑）打造全定位全价位装备的巨型企业。'
    - '&#fff5b3为了效率，他们将整个练诏拳座第五行星改造为巨型烘炉用于打造装备。'
    - '&#fff5b3在发展初期，本来专注于冷兵器的他们吸收了艾斯凯安精工、加德纳安保工业，'
    - '&#fff5b3虽然使公司人事架构更加臃肿，但也增加了更多武器与护具的产业与技术。'
    - '&#fff5b3在大崩溃来临后，烘炉精密的革新派将能够锻造装备的机器序列技术向星空投递，等待被唤醒。'
  recipe_type: NULL
  amount: 1

