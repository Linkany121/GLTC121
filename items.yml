    glow: true
    lore:
    - '&b星座&9：&#ff59da风&#fd81e6海&#fca8f3深&#fad0ff渊&#e2acff滞&#ca89ff留&#b265ff域'
    - '&#fff5b3Seksthiy远征星航舰，一艘后土级拓荒舰，他们是大崩溃前人之领派出的最后一艘有着数亿人的巨型拓荒舰，'
    - '&#fff5b3在大崩溃来临后，舰体被困于风铃与海铃座之间由粒子法则分子法则交界点产生的滞留域中，'
    - '&#fff5b3这片诡异的空间有着不正常的空间与时间紊流，正是如此，外界过了数亿年，而他们的时间只失去了300年。'
    - '&#fff5b3在这段时间里，他们艰难的维持舰体运作，积极与外界联络，最终与新生星系的工程师————也就是你，取得了联系。'
    - '&#fff5b3在获取seky蓝图后，你能生产一系列与特殊核能有关的材料与机器，并与舰体交易材料，各取所需。'
    - '&8或者...去寻找亿万年前的真相：什么是人之领，什么，是大崩溃？'
  recipe_type: NULL
  amount: 1

